services:
  edge-bacnet:
    profiles: ["bacnet"]
    build:
      context: ../..
      dockerfile: examples/edge-microdot/Dockerfile
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "512k"
        max-file: "1"
    environment:
      EDGE_DRIVER: bacnet
      EDGE_SD_CARD: "${EDGE_SD_CARD:-1}"
      EDGE_DURABLE_MINUTES: "${EDGE_DURABLE_MINUTES:-15}"
      EDGE_LOG_LEVEL: "${EDGE_LOG_LEVEL:-WARNING}"
      EDGE_LOG_FILE: /tmp/edge-microdot.log
      EDGE_LOG_FLUSH_MINUTES: "${EDGE_LOG_FLUSH_MINUTES:-15}"
      EDGE_POLL_INTERVAL: "${EDGE_POLL_INTERVAL:-15}"
      EDGE_DB_PATH: /app/examples/edge-microdot/var/edge_history.duckdb
      EDGE_DB_MAX_MB: "${EDGE_DB_MAX_MB:-100}"
      EDGE_MEMORY_RETENTION_HOURS: "${EDGE_MEMORY_RETENTION_HOURS:-48}"
      EDGE_DUCKDB_WASM_URL: "${EDGE_DUCKDB_WASM_URL:-}"
      EDGE_DUCKDB_WASM_BUNDLE_BASE: "${EDGE_DUCKDB_WASM_BUNDLE_BASE:-}"
      EDGE_ENABLE_SPARQL: "${EDGE_ENABLE_SPARQL:-0}"
      EDGE_SITE: "${EDGE_SITE:-demo-site}"
      EDGE_HOST: "${EDGE_HOST:-127.0.0.1}"
      EDGE_PORT: "${EDGE_PORT:-8080}"
      EDGE_FLUSH_INTERVAL: "${EDGE_FLUSH_INTERVAL:-30}"
      EDGE_SNAPSHOT_INTERVAL: "${EDGE_SNAPSHOT_INTERVAL:-}"
      EDGE_FDD_INTERVAL: "${EDGE_FDD_INTERVAL:-60}"
      EDGE_HOT_BACKEND: "${EDGE_HOT_BACKEND:-dict}"
      EDGE_SECRET_KEY: "${EDGE_SECRET_KEY:-}"
      EDGE_SECRET_KEY_FILE: "${EDGE_SECRET_KEY_FILE:-}"
      EDGE_USERS: "${EDGE_USERS:-}"
      EDGE_USERS_FILE: "${EDGE_USERS_FILE:-}"
      EDGE_TOKEN_TTL: "${EDGE_TOKEN_TTL:-3600}"
      EDGE_SESSION_TTL: "${EDGE_SESSION_TTL:-}"
      EDGE_ROLES: "${EDGE_ROLES:-}"
      EDGE_RULES_WRITE: "${EDGE_RULES_WRITE:-0}"
      EDGE_AUTH_DISABLED: "${EDGE_AUTH_DISABLED:-}"
      EDGE_ALLOW_UNAUTHENTICATED: "${EDGE_ALLOW_UNAUTHENTICATED:-}"
      EDGE_SSL_CERT: "${EDGE_SSL_CERT:-}"
      EDGE_SSL_KEY: "${EDGE_SSL_KEY:-}"
      EDGE_TLS_ALLOW: "${EDGE_TLS_ALLOW:-}"
      EDGE_BACNET_ADDRESS: "${EDGE_BACNET_ADDRESS:-}"
      EDGE_BACNET_DEVICES: "${EDGE_BACNET_DEVICES:-54545,5007}"
    volumes:
      - ./var:/app/examples/edge-microdot/var
    command:
      - "--driver"
      - "bacnet"
      - "--address"
      - "${EDGE_BACNET_ADDRESS}"
      - "--devices"
      - "${EDGE_BACNET_DEVICES:-54545,5007}"
      - "--max-props"
      - "25"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "8080"

  edge-niagara:
    profiles: ["niagara"]
    build:
      context: ../..
      dockerfile: examples/edge-microdot/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    # Caddy runs on the host network and reaches Microdot through this loopback-only
    # published port. Microdot listens on 0.0.0.0 inside the container so the
    # published port can reach it; it is not exposed on the LAN.
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "512k"
        max-file: "1"
    environment:
      EDGE_DRIVER: niagara
      NIAGARA_URL: ${NIAGARA_URL:-}
      NIAGARA_USER: ${NIAGARA_USER:-}
      NIAGARA_PASS: ${NIAGARA_PASS:-}
      NIAGARA_INSECURE: "${NIAGARA_INSECURE:-0}"
      NIAGARA_WS_AUTH_HEADER: "${NIAGARA_WS_AUTH_HEADER:-0}"
      EDGE_SD_CARD: "${EDGE_SD_CARD:-1}"
      EDGE_DURABLE_MINUTES: "${EDGE_DURABLE_MINUTES:-15}"
      EDGE_LOG_LEVEL: "${EDGE_LOG_LEVEL:-WARNING}"
      EDGE_LOG_FILE: /tmp/edge-microdot.log
      EDGE_LOG_FLUSH_MINUTES: "${EDGE_LOG_FLUSH_MINUTES:-15}"
      EDGE_POLL_INTERVAL: "${EDGE_POLL_INTERVAL:-15}"
      EDGE_DB_PATH: /app/examples/edge-microdot/var/edge_history.duckdb
      EDGE_DB_MAX_MB: "${EDGE_DB_MAX_MB:-100}"
      EDGE_MEMORY_RETENTION_HOURS: "${EDGE_MEMORY_RETENTION_HOURS:-48}"
      EDGE_DUCKDB_WASM_URL: "${EDGE_DUCKDB_WASM_URL:-}"
      EDGE_DUCKDB_WASM_BUNDLE_BASE: "${EDGE_DUCKDB_WASM_BUNDLE_BASE:-}"
      EDGE_ENABLE_SPARQL: "${EDGE_ENABLE_SPARQL:-0}"
      EDGE_SITE: "${EDGE_SITE:-demo-site}"
      EDGE_HOST: "${EDGE_HOST:-0.0.0.0}"
      EDGE_PORT: "${EDGE_PORT:-8080}"
      EDGE_FLUSH_INTERVAL: "${EDGE_FLUSH_INTERVAL:-30}"
      EDGE_SNAPSHOT_INTERVAL: "${EDGE_SNAPSHOT_INTERVAL:-}"
      EDGE_FDD_INTERVAL: "${EDGE_FDD_INTERVAL:-60}"
      EDGE_HOT_BACKEND: "${EDGE_HOT_BACKEND:-dict}"
      EDGE_SECRET_KEY: "${EDGE_SECRET_KEY:-}"
      EDGE_SECRET_KEY_FILE: "${EDGE_SECRET_KEY_FILE:-}"
      EDGE_USERS: "${EDGE_USERS:-}"
      EDGE_USERS_FILE: "${EDGE_USERS_FILE:-}"
      EDGE_TOKEN_TTL: "${EDGE_TOKEN_TTL:-3600}"
      EDGE_SESSION_TTL: "${EDGE_SESSION_TTL:-}"
      EDGE_ROLES: "${EDGE_ROLES:-}"
      EDGE_RULES_WRITE: "${EDGE_RULES_WRITE:-0}"
      EDGE_AUTH_DISABLED: "${EDGE_AUTH_DISABLED:-}"
      EDGE_ALLOW_UNAUTHENTICATED: "${EDGE_ALLOW_UNAUTHENTICATED:-}"
      EDGE_SSL_CERT: "${EDGE_SSL_CERT:-}"
      EDGE_SSL_KEY: "${EDGE_SSL_KEY:-}"
      EDGE_TLS_ALLOW: "${EDGE_TLS_ALLOW:-}"
      NIAGARA_CA_FILE: "${NIAGARA_CA_FILE:-}"
      BASK_BASE_ORD: "${BASK_BASE_ORD:-slot:/Drivers}"
    volumes:
      - ./var:/app/examples/edge-microdot/var
    command:
      - "--driver"
      - "niagara"
      - "--station"
      - "${NIAGARA_URL}"
      - "--base"
      - "${BASK_BASE_ORD:-slot:/Drivers}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"

  caddy:
    image: caddy:2@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      EDGE_TLS_HOST: "${EDGE_TLS_HOST:-:443}"
      EDGE_TLS_BIND: "${EDGE_TLS_BIND:-0.0.0.0}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
