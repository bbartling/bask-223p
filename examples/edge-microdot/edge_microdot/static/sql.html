<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>edge-microdot · SQL</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #141b24;
      --accent: #3dd6c3;
      --alarm: #ff5c5c;
      --text: #e8eef6;
      --muted: #8b9bb0;
      --border: #243041;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 20% 0%, #132033, var(--bg)); color: var(--text); min-height: 100vh; }
    header { padding: 1rem 1.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 1rem; }
    h1 { margin: 0; font-size: 1.05rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
    a.nav { color: var(--text); text-decoration: none; font-size: 0.85rem; padding: 0.3rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
    a.nav:hover { border-color: var(--accent); color: var(--accent); }
    .pill { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 0.3rem 0.85rem; font-size: 0.82rem; color: var(--muted); }
    main { padding: 1.25rem 1.5rem 2rem; max-width: 1280px; margin: 0 auto; display: grid; gap: 1rem; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.65rem; align-items: center; margin-bottom: 0.75rem; }
    label { font-size: 0.8rem; color: var(--muted); }
    select, input, button, textarea {
      background: #0b0f14; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.45rem 0.65rem; font-size: 0.88rem;
    }
    button.primary { background: var(--accent); color: #042; border-color: var(--accent); font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    textarea {
      width: 100%; min-height: 210px; font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-size: 0.84rem; line-height: 1.45; resize: vertical;
    }
    .meta-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted); }
    .err { color: var(--alarm); white-space: pre-wrap; font-family: monospace; font-size: 0.82rem; margin-top: 0.5rem; }
    .table-wrap { overflow: auto; max-height: 55vh; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { border-bottom: 1px solid var(--border); padding: 0.4rem 0.5rem; text-align: left; white-space: nowrap; }
    th { position: sticky; top: 0; background: #10161e; color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>edge-microdot · SQL</h1>
      <a class="nav" href="/">Dashboard</a>
    </div>
    <span class="pill" id="status">connecting…</span>
  </header>
  <main>
    <section class="panel">
      <div class="controls">
        <label for="ruleSelect">Query / Rule</label>
        <select id="ruleSelect"></select>
        <label for="paramsInput">Params (JSON)</label>
        <input id="paramsInput" type="text" size="22" placeholder="[]" />
        <button class="primary" id="runBtn" type="button" disabled>Run on edge (Ctrl+Enter)</button>
      </div>
      <textarea id="sqlEditor" spellcheck="false"></textarea>
      <div class="meta-row">
        <span id="bundleInfo">Server DuckDB. Tables: fdd.input_sample, fdd.point, fdd.rule_result, sensor_history. History on disk is Parquet.</span>
        <span id="execInfo"></span>
      </div>
      <div class="err" id="errorBox"></div>
    </section>
    <section class="panel table-wrap">
      <table id="resultTable">
        <thead id="resultHead"></thead>
        <tbody id="resultBody"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/sql.js"></script>
</body>
</html>
