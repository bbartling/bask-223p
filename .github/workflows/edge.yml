name: edge
on:
  push:
  pull_request:
jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned dependencies match PyPI
        run: python scripts/check_pypi_pins.py pyproject.toml examples/edge-microdot/pyproject.toml
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: python -m pip install -e .
      - run: python -m pip install -e "./examples/edge-microdot[sparql,dev]"
      - run: python -m pytest -q examples/edge-microdot/tests
