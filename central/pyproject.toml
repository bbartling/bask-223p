[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-hvac-central"
version = "0.1.0"
description = "Read-only collector that merges edge 223P exports into one graph"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["rdflib==7.6.0", "pyyaml==6.0.4"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["central*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
