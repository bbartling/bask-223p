[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bask-223p"
version = "0.1.0"
description = "Read-only baskStream (Niagara) to ASHRAE 223P + Brick TTL maker with BACnet scan reconcile"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["rdflib==7.6.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
graph = ["pyshifty==0.6.0", "ontoenv==0.6.4", "pyshacl==0.40.2"]
fast = ["rapidfuzz==3.14.6"]
bask = ["msgpack==1.2.4", "websocket-client==1.9.2", "requests==2.34.2"]
dev = ["pytest==9.2.0", "rapidfuzz==3.14.6"]
all = ["pyshifty==0.6.0", "ontoenv==0.6.4", "pyshacl==0.40.2", "rapidfuzz==3.14.6", "msgpack==1.2.4", "websocket-client==1.9.2", "requests==2.34.2", "pytest==9.2.0"]

[project.scripts]
bask-223p = "bask_223p.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bask_223p*"]

[tool.setuptools.package-data]
bask_223p = [
    "ontologies/223p/*.ttl",
    "ontologies/223p/closure/*.ttl",
    "ontologies/223p/closure/*.rdf",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
